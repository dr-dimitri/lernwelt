name: Quality

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  frontend:
    name: Frontend and issue workflow
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Require a new version and release notes for every merge
        if: github.event_name == 'pull_request'
        env:
          RELEASE_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/check-release-version.mjs
      - run: npm run check
      - name: Bind frontend files to this commit and run
        run: node scripts/frontend-artifact.mjs --pack
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lernwelt-frontend
          path: frontend-artifact
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  desktop:
    name: Desktop (${{ matrix.os }})
    needs: frontend
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'push' && github.ref == 'refs/heads/main' && '["macos-latest","windows-latest"]' || '["macos-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: '1.98.1'
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri -> target
          shared-key: quality-${{ runner.os }}-${{ runner.arch }}
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - run: npm ci
        if: github.event_name == 'pull_request'
      - name: Test native macOS bundle verification
        if: runner.os == 'macOS'
        run: node --test scripts/verify-macos-bundle.test.mjs
      - run: npm run check:rust
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        if: github.event_name == 'pull_request'
        with:
          name: lernwelt-frontend
          path: frontend-artifact
      - name: Verify frontend and prepare CI-only build configuration
        if: github.event_name == 'pull_request'
        run: node scripts/frontend-artifact.mjs --restore --config=ci-build-config.json
      - name: Build native executable
        if: github.event_name == 'pull_request'
        run: npm run desktop:build -- --debug --no-bundle --config ci-build-config.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: github.event_name == 'pull_request'
        with:
          name: lernwelt-debug-${{ matrix.os }}
          path: |
            src-tauri/target/debug/lernwelt
            src-tauri/target/debug/lernwelt.exe
          if-no-files-found: error
          retention-days: 7

  release-build:
    name: Build automatic release
    needs: frontend
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'dr-dimitri/lernwelt'
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      publish: false
      frontend-artifact: lernwelt-frontend
    secrets:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

  publish:
    name: Publish automatic release after quality checks
    needs: [frontend, desktop, release-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.release-build.outputs.build == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/release-publish.yml
    with:
      tag: ${{ needs.release-build.outputs.tag }}
      version: ${{ needs.release-build.outputs.version }}
