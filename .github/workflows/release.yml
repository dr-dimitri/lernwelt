name: Release

on:
  push:
    tags: ['v*']
  workflow_call:
    inputs:
      publish:
        description: Publish after this workflow's checks; main gates publication in Quality.
        type: boolean
        default: true
      frontend-artifact:
        description: Checked frontend artifact from this workflow run, empty for standalone builds.
        type: string
        default: ''
    outputs:
      tag:
        value: ${{ jobs.prepare.outputs.tag }}
      version:
        value: ${{ jobs.prepare.outputs.version }}
      build:
        value: ${{ jobs.prepare.outputs.build }}
    secrets:
      TAURI_SIGNING_PRIVATE_KEY:
        required: true
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD:
        required: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.sha }}
  cancel-in-progress: false
  queue: max

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      build: ${{ steps.release.outputs.build }}
      matrix: ${{ steps.release.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - name: Verify source and prepare stable or explicit rc tag
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/prepare-release.mjs

  build:
    needs: prepare
    if: needs.prepare.outputs.build == 'true'
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
    name: Release (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: '1.98.1'
          components: rustfmt, clippy
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri -> target
          shared-key: release-${{ runner.os }}-${{ runner.arch }}-${{ matrix.target }}
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - run: npm ci
      - name: Verify release source and prepare Tauri version override
        shell: bash
        run: node scripts/release-source.mjs --write-build-config
      - run: npm run check:all
        if: github.ref_type == 'tag'
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        if: inputs.frontend-artifact != ''
        with:
          name: ${{ inputs.frontend-artifact }}
          path: frontend-artifact
      - name: Verify frontend and extend CI-only release configuration
        if: inputs.frontend-artifact != ''
        run: node scripts/frontend-artifact.mjs --restore --config=release-build-config.json
      - name: Build signed update and installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run desktop:build -- --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --config release-build-config.json
      - name: Verify macOS app and packed updater and DMG
        if: runner.os == 'macOS'
        run: node scripts/verify-macos-bundle.mjs "src-tauri/target/${{ matrix.target }}/release/bundle"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ matrix.platform }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.app.tar.gz
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.sig
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*-setup.exe
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [prepare, build]
    if: github.ref_type == 'tag' || inputs.publish
    permissions:
      contents: write
    uses: ./.github/workflows/release-publish.yml
    with:
      tag: ${{ needs.prepare.outputs.tag }}
      version: ${{ needs.prepare.outputs.version }}
