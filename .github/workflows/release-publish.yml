name: Publish release

on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
      version:
        type: string
        required: true

permissions:
  contents: read

jobs:
  publish:
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      RELEASE_VERSION: ${{ inputs.version }}
    concurrency:
      group: release-publish
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: darwin-aarch64
          path: release-assets/darwin-aarch64
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        if: ${{ !contains(inputs.version, '-rc.') }}
        with:
          name: windows-x86_64
          path: release-assets/windows-x86_64
      - name: Assemble complete update manifest
        run: node scripts/release-assets.mjs
      - name: Publish completed release
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/publish-release.mjs
