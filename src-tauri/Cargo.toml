[package]
name = "lernwelt"
version = "0.1.0"
description = "Lokale Lernanwendung für das bayerische Gymnasium"
authors = ["Lernwelt contributors"]
license = "MIT"
edition = "2021"

[lib]
name = "lernwelt_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
